function mutualFriendsCount(id) {
  const s = "mutual-" + id;
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h % 19; // numero stabile ma "casuale" tra 0 e 18
}

function totalFriendsCount(id) {
  const s = "total-" + id;
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const base = 20 + (h % 280); // tra 20 e 299
  return Math.max(base, mutualFriendsCount(id));
}

function getMutualFriends(profile) {
  const count = mutualFriendsCount(profile.id);
  const pool = ALL_KNOWN_PROFILES.filter(x => x.id !== profile.id);
  let seed = 0;
  const s = "mutual-list-" + profile.id;
  for (let i = 0; i < s.length; i++) seed = (seed * 31 + s.charCodeAt(i)) >>> 0;
  const arr = [...pool];
  for (let i = arr.length - 1; i > 0; i--) {
    seed = (seed * 1103515245 + 12345) >>> 0;
    const j = seed % (i + 1);
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr.slice(0, Math.min(count, arr.length));
}

function compatibilityScore(profile, me) {
  let score = 0;
  if (me) {
    const myLangs = me.languages || [], myOffers = me.offers || [], mySeeks = me.seeks || [], myTags = me.tags || [];
    score += (profile.languages || []).filter(l => myLangs.includes(l)).length;
    score += (profile.tags || []).filter(t => myTags.includes(t)).length * 1.5;
    score += (profile.offers || []).filter(o => mySeeks.includes(o)).length;
    score += (profile.seeks || []).filter(s => myOffers.includes(s)).length;
  }
  if (profile.updates && profile.updates.length) score += 0.5; // leggero bonus per attivita recente
  return score;
}

function weightedShuffle(list, me) {
  const pool = list.map(p => ({ p, w: 1 + compatibilityScore(p, me) * 2 }));
  const result = [];
  while (pool.length) {
    const total = pool.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (; idx < pool.length; idx++) { r -= pool[idx].w; if (r <= 0) break; }
    if (idx >= pool.length) idx = pool.length - 1;
    result.push(pool[idx].p);
    pool.splice(idx, 1);
  }
  return result;
}

function matchesFilters(profile, industryFilters, languageFilters, roleFilters, locationFilters) {
  if (industryFilters.length && !industryFilters.some(t => profile.tags.includes(t))) return false;
  if (languageFilters.length && !languageFilters.some(l => (profile.languages||[]).includes(l))) return false;
  if (roleFilters.length) {
    const roles = [...(profile.offers||[]), ...(profile.seeks||[])];
    if (!roleFilters.some(r => roles.includes(r))) return false;
  }
  if (locationFilters.length && !locationFilters.includes(profile.country)) return false;
  return true;
}

function SwipeDeck({ onMatch, onUndoMatch, onPassProfile, onUndoPass, onOpenMap, matchCount, blockedIds, passedIds, matchedIds, sentLikes, liveUpdates, me, initialSearchOpen, industryFilters, setIndustryFilters, languageFilters, setLanguageFilters, roleFilters, setRoleFilters, locationFilters, setLocationFilters, recentSearches, setRecentSearches }) {
  const [index, setIndex] = useState(0);
  const [offset, setOffset] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [lastSwipe, setLastSwipe] = useState(null);
  const [noTransition, setNoTransition] = useState(false);
  const [searchOpen, setSearchOpen] = useState(() => !!initialSearchOpen);
  const [openFilterPanel, setOpenFilterPanel] = useState(null);
  const [likedIds, setLikedIds] = useState([]);
  const [hasDragged, setHasDragged] = useState(false);
  const [viewingProfile, setViewingProfile] = useState(null);
  const startX = useRef(0);
  const cardRef = useRef(null);

  useEffect(() => {
    const el = cardRef.current;
    if (!el) return;
    const blockScroll = (e) => { if (dragging && e.cancelable) e.preventDefault(); };
    el.addEventListener("touchmove", blockScroll, { passive:false });
    return () => el.removeEventListener("touchmove", blockScroll);
  }, [dragging]);
  const [frozenProfile, setFrozenProfile] = useState(null);

  const [orderedIds] = useState(() => weightedShuffle(DEMO_PROFILES, me).map(p => p.id));
  const available = orderedIds.map(id => DEMO_PROFILES.find(p => p.id === id)).filter(p => p && !blockedIds.includes(p.id) && !passedIds.includes(p.id) && !matchedIds.includes(p.id) && !(sentLikes||[]).includes(p.id) && (!me || p.id !== me.id));
  const profile = frozenProfile || (available.length ? available[index % available.length] : null);

  const searchResults = available.filter(p => matchesFilters(p, industryFilters, languageFilters, roleFilters, locationFilters));
  const mapResults = DEMO_PROFILES.filter(p => !blockedIds.includes(p.id) && matchesFilters(p, industryFilters, languageFilters, roleFilters, locationFilters));
  const filtersActive = !!(industryFilters.length || languageFilters.length || roleFilters.length || locationFilters.length);

  const toggleFilter = (list, setList, v) => setList(list.includes(v) ? list.filter(x => x !== v) : [...list, v]);

  const closeSearch = () => {
    if (filtersActive) {
      const label = [industryFilters.join("+"), languageFilters.join("+"), roleFilters.join("+"), locationFilters.join("+")].filter(Boolean).join(" \u00b7 ");
      const snapshot = { label, industryFilters, languageFilters, roleFilters, locationFilters };
      setRecentSearches(prev => [snapshot, ...prev.filter(s => s.label !== label)].slice(0, 5));
    }
    setSearchOpen(false);
  };
  const applyRecent = (s) => { setIndustryFilters(s.industryFilters); setLanguageFilters(s.languageFilters); setRoleFilters(s.roleFilters); setLocationFilters(s.locationFilters); setSearchOpen(true); };

  const likeFromSearch = (p) => {
    onMatch(p);
    setLikedIds(ids => ids.includes(p.id) ? ids : [...ids, p.id]);
  };

  const getX = (e) => (e.touches ? e.touches[0].clientX : e.clientX);
  const onDown = (e) => { setDragging(true); setHasDragged(false); startX.current = getX(e); if (e.cancelable) e.preventDefault(); };
  const onMoveEv = (e) => { if (!dragging) return; if (e.cancelable) e.preventDefault(); const o = getX(e) - startX.current; if (Math.abs(o) > 6) setHasDragged(true); setOffset(o); };
  const onUp = () => {
    if (!dragging) return;
    setDragging(false);
    if (!hasDragged) { setOffset(0); if (profile) setViewingProfile(profile); return; }
    if (offset > 90) commit(true);
    else if (offset < -90) commit(false);
    else setOffset(0);
  };

  const commit = (liked) => {
    if (!profile) return;
    const swipedProfile = profile;
    setFrozenProfile(swipedProfile);
    setDragging(false);
    setNoTransition(false);
    setOffset(liked ? 700 : -700);
    if (liked) onMatch(swipedProfile);
    else if (onPassProfile) onPassProfile(swipedProfile.id);
    setTimeout(() => {
      setNoTransition(true);
      setOffset(0);
      setIndex(i => i + 1);
      setLastSwipe({ profile:swipedProfile, liked });
      setFrozenProfile(null);
      setTimeout(() => setNoTransition(false), 30);
    }, 260);
  };

  const onUndo = () => {
    if (!lastSwipe) return;
    const dir = lastSwipe.liked ? 700 : -700;
    if (lastSwipe.liked && onUndoMatch) onUndoMatch(lastSwipe.profile.id);
    if (!lastSwipe.liked && onUndoPass) onUndoPass(lastSwipe.profile.id);
    setNoTransition(true);
    setIndex(i => Math.max(0, i - 1));
    setOffset(dir);
    setLastSwipe(null);
    setTimeout(() => {
      setNoTransition(false);
      setOffset(0);
    }, 30);
  };

  const handleLikeFromDetail = () => {
    if (viewingProfile && profile && viewingProfile.id === profile.id) { commit(true); return; }
    if (viewingProfile) {
      onMatch(viewingProfile);
      setLikedIds(ids => ids.includes(viewingProfile.id) ? ids : [...ids, viewingProfile.id]);
      setViewingProfile(null);
    }
  };
  const handlePassFromDetail = () => {
    if (viewingProfile && profile && viewingProfile.id === profile.id) { commit(false); return; }
    setViewingProfile(null);
  };

  const rotation = offset / 18;
  const likeOp = Math.min(Math.max(offset / 90, 0), 1);
  const passOp = Math.min(Math.max(-offset / 90, 0), 1);

  return h("div", { style:{ maxWidth:380, margin:"0 auto" } },
    h("p", { style:{ fontSize:19, fontWeight:800, color:INK, margin:"0 0 16px" } }, "Discover"),

    !profile && h("div", { style:{ textAlign:"center", padding:"50px 20px" } },
      h("div", { style:{ display:"flex", justifyContent:"center", marginBottom:14 } }, h(IconBriefcase, { size:36, color:MUTED })),
      h("p", { style:{ fontSize:15, fontWeight:700, color:INK, margin:"0 0 6px" } }, "You've seen all available profiles"),
      h("p", { style:{ fontSize:12.5, color:MUTED, margin:0, lineHeight:1.6 } }, "Come back later for new profiles, or go to Settings to restore the ones you passed on.")
    ),

    profile && h("div", { style:{ position:"relative", display:"flex", justifyContent:"center" } },
      h("div", {
        ref:cardRef,
        onMouseDown:onDown, onMouseMove:onMoveEv, onMouseUp:onUp, onMouseLeave:onUp,
        onTouchStart:onDown, onTouchMove:onMoveEv, onTouchEnd:onUp,
        style:{
          transform:`translateX(${offset}px) rotate(${rotation}deg)`,
          transition: noTransition ? "none" : "transform 0.26s ease",
          touchAction:"none", userSelect:"none",
          cursor: dragging ? "grabbing" : "grab",
          position:"relative"
        }
      },
        h(ProfileCard, { profile, me }),
        h("div", { style:{ position:"absolute", top:20, left:20, border:`3px solid ${PLUM}`, color:PLUM, padding:"4px 10px", borderRadius:8, fontWeight:800, fontSize:17, transform:"rotate(-12deg)", opacity:likeOp, pointerEvents:"none", background:"rgba(255,255,255,0.85)" } }, "MI PIACE"),
        h("div", { style:{ position:"absolute", top:20, right:20, border:`3px solid ${CORAL}`, color:CORAL, padding:"4px 10px", borderRadius:8, fontWeight:800, fontSize:17, transform:"rotate(12deg)", opacity:passOp, pointerEvents:"none", background:"rgba(255,255,255,0.85)" } }, "PASSO")
      )
    ),
    !searchOpen && profile && h("div", { style:{ display:"flex", justifyContent:"center", alignItems:"center", gap:16, marginTop:20 } },
      h("button", { onClick:onUndo, disabled:!lastSwipe, title:"Torna indietro (max 1 swipe)", style:{ width:56, height:56, borderRadius:"50%", border:"none", background:CARD, display:"flex", alignItems:"center", justifyContent:"center", boxShadow:SHADOW, opacity: lastSwipe ? 1 : 0.5 } }, h(IconUndo, { size:24, color: lastSwipe ? "#D4A72C" : "#C7C2B8" })),
      h("button", { onClick:()=>commit(false), style:{ width:56, height:56, borderRadius:"50%", border:"none", background:CARD, fontSize:21, color:MUTED, boxShadow:SHADOW } }, "\u2715"),
      h("button", { onClick:()=>commit(true), style:{ width:56, height:56, borderRadius:"50%", border:"none", background:GRADIENT, display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"0 8px 20px rgba(255,107,74,0.4)" } }, h(IconBriefcase, { size:23, color:"#fff" }))
    ),
    !searchOpen && profile && h("p", { style:{ textAlign:"center", fontSize:12, color:MUTED, marginTop:14 } }, "Drag the card to respond, tap to view the profile"),
    viewingProfile && h(ProfileDetail, { profile:viewingProfile, onClose:()=>setViewingProfile(null), onLike:handleLikeFromDetail, onPass:handlePassFromDetail, allowActions:true, liveUpdates, me })
  );
}

function Chat({ match, messages, onSend, onBack, onDeleteChat, onBlock, onReport, liveUpdates, me }) {
  const [input, setInput] = useState("");
  const [menuOpen, setMenuOpen] = useState(false);
  const [confirmAction, setConfirmAction] = useState(null);
  const [viewingProfile, setViewingProfile] = useState(false);

  const send = () => {
    if (!input.trim()) return;
    onSend(input.trim());
    setInput("");
  };

  const runConfirm = () => {
    if (confirmAction === "delete") onDeleteChat(match.id);
    if (confirmAction === "block") onBlock(match.id);
    if (confirmAction === "report") onReport(match.id);
    setConfirmAction(null);
    onBack();
  };

  const confirmText = {
    delete: "Delete this chat? You won't be able to see it again.",
    block: "Block " + match.name + "? You won't see each other anymore.",
    report: "Report " + match.name + "? The profile will be blocked and the report sent to our team.",
  };

  return h("div", { style:{ maxWidth:380, margin:"0 auto", display:"flex", flexDirection:"column", height:"calc(100vh - " + (NAV_H + 40) + "px)", position:"relative" } },
    h("div", { style:{ marginBottom:10 } }, h(BackButton, { onClick:onBack, label:"Back" })),
    h("div", { style:{ display:"flex", alignItems:"center", gap:8, marginBottom: confirmAction ? 8 : 16 } },
      h("button", { onClick:()=>setViewingProfile(true), style:{ display:"flex", alignItems:"center", gap:8, flex:1, border:"none", background:"none", padding:0, textAlign:"left", cursor:"pointer" } },
        h(Avatar, { photo:match.photo, initials:match.initials, size:34 }),
        h("p", { style:{ fontSize:16, fontWeight:700, color:INK, margin:0 } }, match.name)
      ),
      h("div", { style:{ position:"relative" } },
        h("button", { onClick:()=>setMenuOpen(o=>!o), style:{ border:"none", background:"none", fontSize:18, color:MUTED, padding:"0 6px" } }, "\u22EE"),
        menuOpen && h(React.Fragment, null,
          h("div", { onClick:()=>setMenuOpen(false), style:{ position:"fixed", inset:0, zIndex:1100 } }),
          h("div", { style:{ position:"absolute", top:"100%", right:0, background:CARD, borderRadius:12, boxShadow:SHADOW, zIndex:1101, marginTop:4, width:180, overflow:"hidden" } },
            h("button", { onClick:()=>{ setConfirmAction("report"); setMenuOpen(false); }, style:{ width:"100%", textAlign:"left", padding:"10px 14px", border:"none", background:"none", fontSize:13, color:CORAL, fontWeight:600 } }, "Report"),
            h("button", { onClick:()=>{ setConfirmAction("block"); setMenuOpen(false); }, style:{ width:"100%", textAlign:"left", padding:"10px 14px", border:"none", background:"none", fontSize:13, color:CORAL, fontWeight:600 } }, "Block"),
            h("button", { onClick:()=>{ setConfirmAction("delete"); setMenuOpen(false); }, style:{ width:"100%", textAlign:"left", padding:"10px 14px", border:"none", background:"none", fontSize:13, color:MUTED, fontWeight:600 } }, "Delete chat")
          )
        )
      )
    ),
    confirmAction && h("div", { style:{ background:"#FFF3EF", border:`1px solid ${CORAL_BG}`, borderRadius:12, padding:"10px 12px", marginBottom:14 } },
      h("p", { style:{ fontSize:12.5, color:INK, margin:"0 0 8px", lineHeight:1.5 } }, confirmText[confirmAction]),
      h("div", { style:{ display:"flex", gap:8 } },
        h("button", { onClick:()=>setConfirmAction(null), style:{ flex:1, padding:"6px 0", borderRadius:8, border:`1px solid ${BORDER}`, background:CARD, fontSize:12, color:MUTED, fontWeight:600 } }, "Cancel"),
        h("button", { onClick:runConfirm, style:{ flex:1, padding:"6px 0", borderRadius:8, border:"none", background:CORAL, color:"#fff", fontSize:12, fontWeight:700 } }, "Confirm")
      )
    ),
    h("div", { style:{ flex:1, overflowY:"auto", display:"flex", flexDirection:"column", gap:8 } },
      messages.length === 0 && h("p", { style:{ fontSize:12.5, color:MUTED, textAlign:"center", marginTop:20 } }, "No messages yet. Write the first one!"),
      messages.map((m,i) => h("div", { key:i, style:{ alignSelf: m.from==="me"?"flex-end":"flex-start", background: m.from==="me"?GRADIENT:"#F4F1F8", color: m.from==="me"?"#fff":INK, padding:"9px 13px", borderRadius:16, fontSize:13.5, maxWidth:"80%" } }, m.text))

function sharedTraitsText(p, me) {
  if (!me) return "";
  const sharedTags = (p.tags || []).filter(t => (me.tags||[]).includes(t));
  return sharedTags.join(", ");
}

function MapScreen({ blockedIds, liveUpdates, me, matchedIds, industryFilters, setIndustryFilters, languageFilters, setLanguageFilters, roleFilters, setRoleFilters, locationFilters, setLocationFilters }) {
  const containerRef = useRef(null);
  const [viewingProfile, setViewingProfile] = useState(null);
  const [openFilterPanel, setOpenFilterPanel] = useState(null);
  const [viewMode, setViewMode] = useState("map");
  const [likedIds, setLikedIds] = useState([]);
  const LIST_CAP = 15;
  const toggleFilter = (list, setList, v) => setList(list.includes(v) ? list.filter(x => x !== v) : [...list, v]);

  const profiles = DEMO_PROFILES.filter(p => !blockedIds.includes(p.id) && (!me || p.id !== me.id) && matchesFilters(p, industryFilters, languageFilters, roleFilters, locationFilters));
  const filterKey = JSON.stringify([industryFilters, languageFilters, roleFilters, locationFilters, blockedIds]);

  useEffect(() => {
    if (viewMode !== "map" || !containerRef.current || typeof L === "undefined") return;
    const map = L.map(containerRef.current, { zoomControl:true, maxZoom:12 }).setView([20, 10], 2);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO", maxZoom:12, subdomains:"abcd"
    }).addTo(map);

    const clusterIconFn = function(cluster) {
      const count = cluster.getChildCount();
      return L.divIcon({
        className: "",
        html: '<div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#FF6B4A,#FFB648);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;">' + count + "</div>",
        iconSize:[44,44], iconAnchor:[22,22]
      });
    };
    const hasClustering = typeof L.markerClusterGroup === "function";
    const clusterGroup = hasClustering
      ? L.markerClusterGroup({
          iconCreateFunction: clusterIconFn,
          showCoverageOnHover: false,
          maxClusterRadius: function(zoom) {
            if (zoom <= 3) return 90;  // vista mondo: raggruppa liberamente anche tra paesi vicini
            if (zoom <= 5) return 45;  // vista continente: i paesi iniziano a separarsi
            if (zoom <= 7) return 20;  // vista paese: solo citta davvero vicine si uniscono
            return 10;                 // vista regione/citta: raggruppamento minimo
          }
        })
      : null;

    const groups = {};
    profiles.forEach(p => {
      if (!CITY_COORDS[p.city]) return;
      if (!groups[p.city]) groups[p.city] = [];
      groups[p.city].push(p);
    });

    Object.keys(groups).forEach(city => {
      const group = groups[city];
      const base = CITY_COORDS[city];
      const matchedHere = group.filter(p => matchedIds && matchedIds.includes(p.id));
      const isFriendCity = matchedHere.length > 0;
      const first = isFriendCity ? matchedHere[0] : group[0];
      const count = group.length;
      const avatarHtml = first.photo
        ? '<img src="' + first.photo + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />'
        : first.initials;
      const gradient = isFriendCity ? "linear-gradient(135deg,#5B3A8E,#8B6BC7)" : "linear-gradient(135deg,#FF6B4A,#FFB648)";
      const friendBadgeHtml = isFriendCity
        ? '<div style="position:absolute;top:-3px;left:-3px;background:#1E9E64;color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;">\u2713</div>'
        : "";
      const badgeHtml = count > 1
        ? '<div style="position:absolute;bottom:-4px;right:-4px;background:#5B3A8E;color:#fff;font-size:10px;font-weight:800;border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 3px;">' + count + '</div>'
        : "";
      const icon = L.divIcon({
        className: "",
        html: '<div style="position:relative;width:38px;height:38px;">' +
          '<div style="width:100%;height:100%;border-radius:50%;background:' + gradient + ';border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;overflow:hidden;">' + avatarHtml + '</div>' +
          friendBadgeHtml + badgeHtml + '</div>',
        iconSize:[38,38], iconAnchor:[19,19]
      });
      const marker = L.marker(base, { icon });
      if (clusterGroup) clusterGroup.addLayer(marker); else marker.addTo(map);
      const popupDiv = document.createElement("div");
      popupDiv.style.fontFamily = "-apple-system, sans-serif";
      popupDiv.style.fontSize = "13px";
      popupDiv.style.maxWidth = "220px";
      const POPUP_CAP = 8;
      const sortedGroup = [...group].sort((a, b) => {
        const aHas = sharedTraitsText(a, me) ? 1 : 0;
        const bHas = sharedTraitsText(b, me) ? 1 : 0;
        if (bHas !== aHas) return bHas - aHas;
        return compatibilityScore(b, me) - compatibilityScore(a, me);
      });
      const shown = sortedGroup.slice(0, POPUP_CAP);
      const extra = group.length - shown.length;
      let inner = "<strong>" + city + ", " + first.country + "</strong><br/>" +
        '<span style="color:#8A8199;font-size:12px;">' + count + (count === 1 ? " persona" : " persone") + "</span>" +
        '<hr style="margin:8px 0;border:none;border-top:1px solid #eee;" />' +
        '<div style="max-height:220px;overflow-y:auto;">';
      shown.forEach(p => {
        const isMatch = matchedIds && matchedIds.includes(p.id);
        const traits = sharedTraitsText(p, me);
        inner += '<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px;">' +
          '<div style="position:relative;flex-shrink:0;">' +
          (p.photo
            ? '<img src="' + p.photo + '" style="width:26px;height:26px;border-radius:50%;object-fit:cover;' + (isMatch ? "border:2px solid #5B3A8E;" : "") + '" />'
            : '<div style="width:26px;height:26px;border-radius:50%;background:#EFE7FA;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#5B3A8E;' + (isMatch ? "border:2px solid #5B3A8E;" : "") + '">' + p.initials + "</div>") +
          "</div>" +
          '<div style="flex:1;min-width:0;">' +
          '<div>' + p.name + " " + (p.surname||"") + (isMatch ? ' <span style="color:#1E9E64;font-size:10px;font-weight:700;">\u2713 match</span>' : "") + '</div>' +
          (traits ? '<div style="font-size:10px;color:#D4A72C;font-weight:600;">\u2728 ' + traits + '</div>' : "") +
          "</div>" +
          '<button id="mapviewbtn-' + p.id + '" style="border:none;border-radius:6px;background:#5B3A8E;color:#fff;font-size:10.5px;padding:4px 9px;cursor:pointer;flex-shrink:0;">Vedi</button>' +
        "</div>";
      });
      inner += "</div>";
      if (extra > 0) {
        inner += '<p style="margin:4px 0 0;font-size:11px;color:#8A8199;">+' + extra + " altri in questa citta</p>";
      }
      popupDiv.innerHTML = inner;
      marker.bindPopup(popupDiv);
      marker.on("popupopen", () => {
        shown.forEach(p => {
          const btn = document.getElementById("mapviewbtn-" + p.id);
          if (btn) btn.onclick = () => setViewingProfile(p);
        });
      });
    });

    if (clusterGroup) map.addLayer(clusterGroup);

    return () => map.remove();
  }, [filterKey, viewMode]);

  return h("div", { style:{ maxWidth:460, margin:"0 auto" } },
    h("p", { style:{ fontSize:19, fontWeight:800, color:INK, margin:"0 0 4px" } }, "Search and map"),

    h("div", { style:{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:10 } },
      h("div", { style:{ flex:"1 1 45%", minWidth:130 } }, h(FilterDropdown, { label:"Industry", options:ALL_INDUSTRY_TAGS, selected:industryFilters, onToggle:(t)=>toggleFilter(industryFilters, setIndustryFilters, t), isOpen: openFilterPanel==="industry", onToggleOpen:()=>setOpenFilterPanel(p=>p==="industry"?null:"industry"), tone:"plum" })),
      h("div", { style:{ flex:"1 1 45%", minWidth:130 } }, h(FilterDropdown, { label:"Language", options:SUGGESTED_LANGUAGES, selected:languageFilters, onToggle:(l)=>toggleFilter(languageFilters, setLanguageFilters, l), isOpen: openFilterPanel==="language", onToggleOpen:()=>setOpenFilterPanel(p=>p==="language"?null:"language"), tone:"plum" })),
      h("div", { style:{ flex:"1 1 45%", minWidth:130 } }, h(FilterDropdown, { label:"Offers / looking for", options:ROLE_OPTIONS, selected:roleFilters, onToggle:(r)=>toggleFilter(roleFilters, setRoleFilters, r), isOpen: openFilterPanel==="role", onToggleOpen:()=>setOpenFilterPanel(p=>p==="role"?null:"role"), tone:"coral" })),
      h("div", { style:{ flex:"1 1 45%", minWidth:130 } }, h(LocationFilterPicker, { selected:locationFilters, onToggle:(c)=>toggleFilter(locationFilters, setLocationFilters, c), onClear:()=>setLocationFilters([]), popularOptions:LOCATION_OPTIONS.filter(x=>x!=="Anywhere"), allOptions:COUNTRIES.filter(x=>x!=="Anywhere") }))
    ),

    h("div", { style:{ display:"flex", background:"#F4F1F8", borderRadius:14, padding:4, marginBottom:12 } },
      h("button", { onClick:()=>setViewMode("map"), style:{ flex:1, padding:"8px 0", borderRadius:10, border:"none", background: viewMode==="map" ? CARD : "transparent", color: viewMode==="map" ? PLUM : MUTED, fontWeight: viewMode==="map" ? 700 : 500, fontSize:12.5, boxShadow: viewMode==="map" ? SHADOW : "none" } }, "Mappa"),
      h("button", { onClick:()=>setViewMode("list"), style:{ flex:1, padding:"8px 0", borderRadius:10, border:"none", background: viewMode==="list" ? CARD : "transparent", color: viewMode==="list" ? PLUM : MUTED, fontWeight: viewMode==="list" ? 700 : 500, fontSize:12.5, boxShadow: viewMode==="list" ? SHADOW : "none" } }, "List")
    ),

    h("p", { style:{ fontSize:12.5, color:MUTED, margin:"0 0 12px" } }, profiles.length + (profiles.length===1?" profile":" profiles") + (viewMode==="map" ? " on the map \u00b7 tap a dot to see who's there." : " found")),

    viewMode==="map" && h("div", { ref:containerRef, style:{ width:"100%", height:420, borderRadius:16, overflow:"hidden", boxShadow:SHADOW } }),
    viewMode==="list" && h("div", null,
      profiles.length===0 && h("p", { style:{ fontSize:14, color:MUTED, textAlign:"center", padding:"30px 0" } }, "No profile matches these filters."),
      profiles.slice(0, LIST_CAP).map(p => h(ResultRow, { key:p.id, profile:p, onLike:(pr)=>setLikedIds(ids=>ids.includes(pr.id)?ids:[...ids,pr.id]), onView:setViewingProfile, liked: likedIds.includes(p.id), me })),
      profiles.length > LIST_CAP && h("p", { style:{ fontSize:12, color:MUTED, textAlign:"center", padding:"10px 0" } }, "Showing the first " + LIST_CAP + " di " + profiles.length + ". Add a filter to narrow the search.")
    ),
    viewingProfile && h(ProfileDetail, { profile:viewingProfile, onClose:()=>setViewingProfile(null), allowActions:false, liveUpdates, me })
  );
}

          h("p", { style:{ fontSize:12.5, color:INK, margin:"0 0 8px", lineHeight:1.5 } }, "Delete your profile? All data (matches, chats, photos) will be lost forever."),
          h("div", { style:{ display:"flex", gap:8 } },
            h("button", { onClick:()=>setConfirmDelete(false), style:{ flex:1, padding:"6px 0", borderRadius:8, border:`1px solid ${BORDER}`, background:CARD, fontSize:12, color:MUTED, fontWeight:600 } }, "Cancel"),
            h("button", { onClick:onDeleteAccount, style:{ flex:1, padding:"6px 0", borderRadius:8, border:"none", background:CORAL, color:"#fff", fontSize:12, fontWeight:700 } }, "Delete")

function ToastBanner({ topOffset, onClick, onDismiss, children }) {
  const [offsetY, setOffsetY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [hasDragged, setHasDragged] = useState(false);
  const startY = useRef(0);

  const getY = (e) => (e.touches ? e.touches[0].clientY : e.clientY);
  const onDown = (e) => { setDragging(true); setHasDragged(false); startY.current = getY(e); };
  const onMove = (e) => {
    if (!dragging) return;
    const dy = getY(e) - startY.current;
    if (dy < 0) { if (Math.abs(dy) > 6) setHasDragged(true); setOffsetY(dy); }
  };
  const onUp = () => {
    if (!dragging) return;
    setDragging(false);
    if (offsetY < -40) { onDismiss(); return; }
    setOffsetY(0);
    if (!hasDragged) onClick();
  };

  return h("div", {
    onMouseDown:onDown, onMouseMove:onMove, onMouseUp:onUp, onMouseLeave:onUp,
    onTouchStart:onDown, onTouchMove:onMove, onTouchEnd:onUp,
    style:{
      position:"fixed", top:topOffset, left:"50%",
      transform:`translateX(-50%) translateY(${offsetY}px)`,
      opacity: Math.max(0, 1 + offsetY / 60),
      width:"calc(100% - 32px)", maxWidth:360, background:CARD, borderRadius:16,
      boxShadow:"0 10px 28px rgba(42,33,64,0.25)", padding:"12px 14px",
      display:"flex", alignItems:"center", gap:10, zIndex:70, cursor:"pointer",
      touchAction:"none", userSelect:"none",
      transition: dragging ? "none" : "transform 0.2s ease, opacity 0.2s ease"
    }
  }, children);
}

function App() {
  const [dataVersion, setDataVersion] = useState(0);
  const [syncStatus, setSyncStatus] = useState(twinventureDb ? "loading" : "offline");

  useEffect(() => {
    if (!twinventureDb) return;
    twinventureDb.from("profiles").select("*").then(({ data, error }) => {
      if (error) { console.error("Twinventure: error loading shared profiles", error); setSyncStatus("error"); return; }
      const existingIds = new Set(DEMO_PROFILES.map(p => p.id));
      (data || []).forEach(row => {
        if (existingIds.has(row.id)) return;
        DEMO_PROFILES.push({
          id: row.id, name: row.name, surname: row.surname, age: row.age, city: row.city,
          country: row.country, targetCountry: row.target_country, dialCode: row.dial_code,
          phone: row.phone, phoneVerified: row.phone_verified, gender: row.gender,
          photos: row.photos || [], photo: row.photo, background: row.background,
          initials: initialsOf(row.name, row.surname),
          tags: row.tags || [], offers: row.offers || [], seeks: row.seeks || [],
          languages: row.languages || [], mindset: [], bio: row.bio, docVerified: row.doc_verified,
          isCloud: true
        });
        if (CITY_COORDS[row.city] === undefined && CITY_COORDS[row.city] !== 0) { /* citta senza coordinate: non comparira sulla mappa, restera visibile altrove */ }
      });
      setSyncStatus("ready");
      setDataVersion(v => v + 1);
    });
  }, []);

  const saveProfileToCloud = (p) => {
    if (!twinventureDb) return;
    twinventureDb.from("profiles").upsert([{
      id: p.id, name: p.name, surname: p.surname, age: p.age, city: p.city,
      country: p.country, target_country: p.targetCountry, dial_code: p.dialCode,
      phone: p.phone, phone_verified: p.phoneVerified, gender: p.gender,
      photos: p.photos, photo: p.photo, background: p.background,
      tags: p.tags, offers: p.offers, seeks: p.seeks, languages: p.languages,
      bio: p.bio, doc_verified: p.docVerified
    }]).then(({ error }) => { if (error) console.error("Twinventure: error saving shared profile", error); });
  };

  const getMyAuthId = async () => {
    if (!twinventureDb) return null;
    try {
      const { data } = await twinventureDb.auth.getUser();
      return data && data.user ? data.user.id : null;
    } catch (e) { return null; }
  };
  const [myAuthId, setMyAuthId] = useState(null);
  const [me, setMe] = useState(() => loadLS("tv_me", null));
  const [matches, setMatches] = useState(() => loadLS("tv_matches", []));
  const [receivedLikes, setReceivedLikes] = useState(() => loadLS("tv_likes", RECEIVED_LIKES_SEED));
  const [sentLikes, setSentLikes] = useState(() => loadLS("tv_sentlikes", []));
  const [blockedIds, setBlockedIds] = useState(() => loadLS("tv_blocked", []));
  const [passedIds, setPassedIds] = useState(() => loadLS("tv_passed", []));
  const [notificationsEnabled, setNotificationsEnabled] = useState(() => loadLS("tv_notif", true));
  const [authChecked, setAuthChecked] = useState(!twinventureDb);
  const [appLang, setAppLang] = useState("en");
  const t = (key) => (I18N.en && I18N.en[key]) || key;
  const [screen, setScreen] = useState(() => {
    if (loadLS("tv_me", null)) return "swipe";
    return loadLS("tv_seenWelcome", false) ? "auth" : "welcome";
  });
  const [activeChat, setActiveChat] = useState(null);
  const [matchCelebration, setMatchCelebration] = useState(null);

  useEffect(() => {
    if (!twinventureDb) { setAuthChecked(true); return; }
    const goPastAuth = () => setScreen(prev => (prev === "auth" || prev === "welcome") ? (loadLS("tv_me", null) ? "swipe" : "onboarding") : prev);
    twinventureDb.auth.getSession().then(({ data }) => {
      if (data && data.session) goPastAuth();
      setAuthChecked(true);
    }).catch(() => setAuthChecked(true));
    const { data: authListener } = twinventureDb.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" && session) goPastAuth();
      if (session && session.user) setMyAuthId(session.user.id);
      if (event === "SIGNED_OUT") setMyAuthId(null);
    });
    return () => { if (authListener && authListener.subscription) authListener.subscription.unsubscribe(); };
  }, []);
  useEffect(() => { if (twinventureDb) getMyAuthId().then(id => { if (id) setMyAuthId(id); }); }, []);
  const [toast, setToast] = useState(null);
  const [unreadCounts, setUnreadCounts] = useState({});
  const [chatMessages, setChatMessages] = useState(() => loadLS("tv_chatmsgs", {}));
  const activeChatIdRef = useRef(null);
  useEffect(() => { activeChatIdRef.current = (screen === "chat" && activeChat) ? activeChat.id : null; }, [screen, activeChat]);
  useEffect(() => { if (screen === "swipe" && reopenSearchOnSwipe) setReopenSearchOnSwipe(false); }, [screen]);
  const [liveUpdates, setLiveUpdates] = useState({});
  const [premiumUnlocked, setPremiumUnlocked] = useState(true);
  const [mapProfiles, setMapProfiles] = useState(null);
  const [reopenSearchOnSwipe, setReopenSearchOnSwipe] = useState(false);
  const [industryFilters, setIndustryFilters] = useState([]);
  const [languageFilters, setLanguageFilters] = useState([]);
  const [roleFilters, setRoleFilters] = useState([]);
  const [locationFilters, setLocationFilters] = useState([]);
  const [recentSearches, setRecentSearches] = useState([]);
  const [profileViews, setProfileViews] = useState(PROFILE_VIEWS_SEED);
  const [viewToast, setViewToast] = useState(null);
  const [likeToast, setLikeToast] = useState(null);
  const [unseenViews, setUnseenViews] = useState(0);

  useEffect(() => { saveLS("tv_me", me); }, [me]);
  useEffect(() => { saveLS("tv_matches", matches); }, [matches]);
  useEffect(() => { saveLS("tv_likes", receivedLikes); }, [receivedLikes]);
  useEffect(() => { saveLS("tv_sentlikes", sentLikes); }, [sentLikes]);
  useEffect(() => { saveLS("tv_blocked", blockedIds); }, [blockedIds]);
  useEffect(() => { saveLS("tv_passed", passedIds); }, [passedIds]);
  useEffect(() => { saveLS("tv_notif", notificationsEnabled); }, [notificationsEnabled]);
  useEffect(() => { saveLS("tv_chatmsgs", chatMessages); }, [chatMessages]);

  const appendMessage = (matchId, msg) => setChatMessages(prev => ({ ...prev, [matchId]: [...(prev[matchId] || []), msg] }));
  const ensureSeeded = (matchId, profile) => setChatMessages(prev => prev[matchId] ? prev : { ...prev, [matchId]: [{ from:"them", text:"Hi! I saw you're also starting from scratch in " + (profile.tags && profile.tags[0]) + ". Where would you like to expand exactly?" }] });
  const pairIds = (a, b) => (a < b ? { user_a:a, user_b:b } : { user_a:b, user_b:a });
  const loadCloudMessages = (match) => {
    if (!twinventureDb || !myAuthId || !match.isCloud) return;
    const { user_a, user_b } = pairIds(myAuthId, match.id);
    twinventureDb.from("messages").select("*").eq("user_a", user_a).eq("user_b", user_b).order("created_at", { ascending:true }).then(({ data, error }) => {
      if (error) { console.error("Twinventure: error loading messages", error); return; }
      setChatMessages(prev => ({ ...prev, [match.id]: (data || []).map(r => ({ from: r.sender_id === myAuthId ? "me" : "them", text:r.body, id:r.id })) }));
    });
  };
  const sendMessage = (matchId, text) => {
    const match = matches.find(m => m.id === matchId);
    if (match && match.isCloud && myAuthId) {
      appendMessage(matchId, { from:"me", text });
      const { user_a, user_b } = pairIds(myAuthId, matchId);
      twinventureDb.from("messages").insert([{ user_a, user_b, sender_id:myAuthId, body:text }]).then(({ error }) => {
        if (error) console.error("Twinventure: error sending message", error);
      });
      return;
    }
    appendMessage(matchId, { from:"me", text });
    setTimeout(() => appendMessage(matchId, { from:"them", text:"Interesting, should we hop on a call this week to discuss it?" }), 1000);
  };

  useEffect(() => {
    const LIVE_UPDATE_MESSAGES = ["Updated their bio", "Added a new photo", "Ha modificato cosa cerca in un partner", "Ha aggiornato i settori", "Added a new spoken language", "Updated their city"];
    const timer = setInterval(() => {
      setLiveUpdates(prev => {
        const next = { ...prev };
        [3, 5].forEach(id => { // Sven and Wei, per la prova
          const msg = LIVE_UPDATE_MESSAGES[Math.floor(Math.random() * LIVE_UPDATE_MESSAGES.length)];
          next[id] = [{ text:msg, time:"Adesso" }, ...(next[id] || [])].slice(0, 5);
        });
        return next;
      });
    }, 15000);
    return () => clearInterval(timer);
  }, []);

  useEffect(() => {
    const timer = setInterval(() => {
      if (!notificationsEnabled) return;
      const viewer = ALL_KNOWN_PROFILES[Math.floor(Math.random() * ALL_KNOWN_PROFILES.length)];
      const entry = { ...viewer, viewedAgo:"Adesso" };
      setProfileViews(prev => [entry, ...prev].slice(0, 10));
      setUnseenViews(v => v + 1);
      setViewToast(entry);
      setTimeout(() => setViewToast(t => (t && t.id === entry.id ? null : t)), 5000);
    }, 30000);
    return () => clearInterval(timer);
  }, [notificationsEnabled]);

  useEffect(() => {
    const timer = setInterval(() => {
      if (!notificationsEnabled) return;
      if (sentLikes.length > 0 && Math.random() < 0.6) {
        const reciprocatorId = sentLikes[Math.floor(Math.random() * sentLikes.length)];
        const reciprocator = DEMO_PROFILES.find(p => p.id === reciprocatorId);
        if (reciprocator) {
          setSentLikes(prev => prev.filter(x => x !== reciprocatorId));
          triggerMatch(reciprocator);
          return;
        }
      }
      const pool = ALL_KNOWN_PROFILES.filter(p => !receivedLikes.some(r => r.id === p.id) && !matches.some(m => m.id === p.id) && !blockedIds.includes(p.id) && !sentLikes.includes(p.id));
      if (pool.length === 0) return;
      const liker = pool[Math.floor(Math.random() * pool.length)];
      setReceivedLikes(prev => [liker, ...prev]);
      setLikeToast(liker);
      setTimeout(() => setLikeToast(t => (t && t.id === liker.id ? null : t)), 5000);
    }, 40000);
    return () => clearInterval(timer);
  }, [notificationsEnabled, receivedLikes, matches, blockedIds, sentLikes]);

  useEffect(() => {
    const DEMO_MESSAGES = [
      "Hi! Have you seen my idea? Let me know what you think.",
      "I talked to a supplier today, interesting news.",
      "Would you like to hop on a call this week?",
      "I updated my profile, take a look.",
      "I think we could really build something together.",
    ];
    const timer = setInterval(() => {
      const demoMatches = matches.filter(m => !m.isCloud);
      if (!notificationsEnabled || demoMatches.length === 0) return;
      const m = demoMatches[Math.floor(Math.random() * demoMatches.length)];
      const text = DEMO_MESSAGES[Math.floor(Math.random() * DEMO_MESSAGES.length)];
      appendMessage(m.id, { from:"them", text });
      if (activeChatIdRef.current !== m.id) {
        setUnreadCounts(prev => ({ ...prev, [m.id]: (prev[m.id] || 0) + 1 }));
        setToast({ match:m, text });
        setTimeout(() => setToast(t => (t && t.match.id === m.id ? null : t)), 5000);
      }
    }, 15000);
    return () => clearInterval(timer);
  }, [notificationsEnabled, matches]);

  const addMatch = (p) => setMatches(prev => prev.find(x=>x.id===p.id) ? prev : [...prev, p]);
  const triggerMatch = (p) => {
    const isNew = !matches.find(x => x.id === p.id);
    addMatch(p);
    if (isNew) setMatchCelebration({ profile:p, phrase: MATCH_PHRASES[Math.floor(Math.random()*MATCH_PHRASES.length)] });
  };
  const matchesRef = useRef(matches);
  useEffect(() => { matchesRef.current = matches; }, [matches]);

  // Real cross-user likes/matches: load who already liked me / who I already liked, resolve mutual matches.
  useEffect(() => {
    if (!twinventureDb || !myAuthId || syncStatus !== "ready") return;
    Promise.all([
      twinventureDb.from("likes").select("from_id").eq("to_id", myAuthId),
      twinventureDb.from("likes").select("to_id").eq("from_id", myAuthId)
    ]).then(([likedMeRes, iLikedRes]) => {
      const likedMeIds = new Set((likedMeRes.data || []).map(r => r.from_id));
      const iLikedIds = new Set((iLikedRes.data || []).map(r => r.to_id));
      likedMeIds.forEach(id => {
        if (!iLikedIds.has(id)) return;
        const p = DEMO_PROFILES.find(x => x.id === id);
        if (p) addMatch(p);
      });
      const pending = [...likedMeIds].filter(id => !iLikedIds.has(id)).map(id => DEMO_PROFILES.find(x => x.id === id)).filter(Boolean);
      if (pending.length) setReceivedLikes(prev => {
        const existing = new Set(prev.map(x => x.id));
        const toAdd = pending.filter(p => !existing.has(p.id));
        return toAdd.length ? [...toAdd, ...prev] : prev;
      });
    });
  }, [myAuthId, syncStatus]);

  // Realtime: someone likes me in real time.
  useEffect(() => {
    if (!twinventureDb || !myAuthId) return;
    const channel = twinventureDb.channel("likes-in-" + myAuthId)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"likes", filter:`to_id=eq.${myAuthId}` }, (payload) => {
        const fromId = payload.new.from_id;
        const p = DEMO_PROFILES.find(x => x.id === fromId);
        if (!p) return;
        twinventureDb.from("likes").select("id").eq("from_id", myAuthId).eq("to_id", fromId).then(({ data }) => {
          if (data && data.length) {
            triggerMatch(p);
            setReceivedLikes(prev => prev.filter(x => x.id !== fromId));
          } else {
            setReceivedLikes(prev => prev.some(x => x.id === p.id) ? prev : [p, ...prev]);
            setLikeToast(p);
            setTimeout(() => setLikeToast(t => (t && t.id === p.id ? null : t)), 5000);
          }
        });
      })
      .subscribe();
    return () => { twinventureDb.removeChannel(channel); };
  }, [myAuthId]);

  // Realtime: real messages arriving from another real user.
  useEffect(() => {
    if (!twinventureDb || !myAuthId) return;
    const handleInsert = (payload) => {
      const row = payload.new;
      if (row.sender_id === myAuthId) return;
      const partnerId = row.user_a === myAuthId ? row.user_b : row.user_a;
      appendMessage(partnerId, { from:"them", text:row.body, id:row.id });
      if (activeChatIdRef.current !== partnerId) {
        const match = matchesRef.current.find(m => m.id === partnerId) || DEMO_PROFILES.find(p => p.id === partnerId);
        if (match) {
          setUnreadCounts(prev => ({ ...prev, [partnerId]: (prev[partnerId] || 0) + 1 }));
          setToast({ match, text:row.body });
          setTimeout(() => setToast(t => (t && t.match.id === partnerId ? null : t)), 5000);
        }
      }
    };
    const ch1 = twinventureDb.channel("msgs-a-" + myAuthId).on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:`user_a=eq.${myAuthId}` }, handleInsert).subscribe();
    const ch2 = twinventureDb.channel("msgs-b-" + myAuthId).on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:`user_b=eq.${myAuthId}` }, handleInsert).subscribe();
    return () => { twinventureDb.removeChannel(ch1); twinventureDb.removeChannel(ch2); };
  }, [myAuthId]);
  const sendLike = (p) => {
    if (p.isCloud && myAuthId) {
      twinventureDb.from("likes").insert([{ from_id: myAuthId, to_id: p.id }]).then(({ error }) => {
        if (error && error.code !== "23505") console.error("Twinventure: error sending like", error);
      });
      const alreadyLikedMe = receivedLikes.some(x => x.id === p.id);
      if (alreadyLikedMe) {
        triggerMatch(p);
        setReceivedLikes(prev => prev.filter(x => x.id !== p.id));
        return;
      }
      setSentLikes(prev => prev.includes(p.id) ? prev : [...prev, p.id]);
      return;
    }
    const alreadyLikedMe = receivedLikes.some(x => x.id === p.id);
    if (alreadyLikedMe) {
      triggerMatch(p);
      setReceivedLikes(prev => prev.filter(x => x.id !== p.id));
      return;
    }
    setSentLikes(prev => prev.includes(p.id) ? prev : [...prev, p.id]);
    if (Math.random() < 0.5) {
      triggerMatch(p);
      setSentLikes(prev => prev.filter(id => id !== p.id));
    }
  };
  const likeBack = (p) => {
    if (p.isCloud && myAuthId) {
      twinventureDb.from("likes").insert([{ from_id: myAuthId, to_id: p.id }]).then(({ error }) => {
        if (error && error.code !== "23505") console.error("Twinventure: error sending like", error);
      });
    }
    triggerMatch(p);
    setReceivedLikes(prev => prev.filter(x => x.id !== p.id));
    setSentLikes(prev => prev.filter(x => x !== p.id));
  };
  const passReceived = (id) => setReceivedLikes(prev => prev.filter(x => x.id !== id));
  const undoMatch = (id) => { setMatches(prev => prev.filter(x => x.id !== id)); setSentLikes(prev => prev.filter(x => x !== id)); };
  const passProfile = (id) => setPassedIds(prev => prev.includes(id) ? prev : [...prev, id]);
  const undoPass = (id) => setPassedIds(prev => prev.filter(x => x !== id));
  const resetPassed = () => setPassedIds([]);
  const deleteChat = (id) => setMatches(prev => prev.filter(m => m.id !== id));
  const blockUser = (id) => { setMatches(prev => prev.filter(m => m.id !== id)); setReceivedLikes(prev => prev.filter(x => x.id !== id)); setBlockedIds(prev => prev.includes(id) ? prev : [...prev, id]); };
  const unblockUser = (id) => setBlockedIds(prev => prev.filter(x => x !== id));
  const reportUser = (id) => { blockUser(id); };
  const logout = () => { if (twinventureDb) twinventureDb.auth.signOut(); setScreen("auth"); };
  const resetDemo = () => {
    localStorage.removeItem("tv_me"); localStorage.removeItem("tv_matches"); localStorage.removeItem("tv_likes"); localStorage.removeItem("tv_blocked"); localStorage.removeItem("tv_notif"); localStorage.removeItem("tv_chatmsgs"); localStorage.removeItem("tv_seenWelcome"); localStorage.removeItem("tv_passed"); localStorage.removeItem("tv_sentlikes");
    setMe(null); setMatches([]); setReceivedLikes(RECEIVED_LIKES_SEED); setSentLikes([]); setBlockedIds([]); setPassedIds([]); setNotificationsEnabled(true); setChatMessages({}); setScreen("welcome");
  };

  if (!authChecked) {
    return h("div", { style:{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center" } }, h(Logo, { size:36 }));
  }

  const showNav = screen !== "auth" && screen !== "welcome" && screen !== "language" && screen !== "onboarding" && screen !== "chat" && screen !== "editprofile" && screen !== "settings";

  return h("div", { style:{ minHeight:"100vh", boxSizing:"border-box", padding: "20px 16px " + (showNav ? (NAV_H + 16) : 20) + "px" } },
    screen !== "auth" && screen !== "welcome" && screen !== "language" && h("div", { style:{ maxWidth:380, margin:"0 auto 20px", display:"flex", justifyContent:"center", alignItems:"center", position:"relative" } },
      h("button", { onClick:()=>setScreen("swipe"), style:{ border:"none", background:"none", padding:0, cursor:"pointer" } }, h(Logo, { size:30 })),
      screen !== "onboarding" && screen !== "editprofile" && h("button", { onClick:()=>{ setScreen("views"); setUnseenViews(0); }, style:{ position:"absolute", right:0, border:"none", background:CARD, borderRadius:"50%", width:36, height:36, display:"flex", alignItems:"center", justifyContent:"center", boxShadow:SHADOW } },
        h(IconBell, { size:17, color:INK }),
        unseenViews > 0 && h("span", { style:{ position:"absolute", top:-3, right:-3, minWidth:17, height:17, borderRadius:"50%", background:GRADIENT, color:"#fff", fontSize:9.5, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 3px", border:"2px solid " + CARD } }, unseenViews)
      )
    ),
    screen==="welcome" && h(WelcomeScreen, { t, onContinue:()=>{ saveLS("tv_seenWelcome", true); setScreen("auth"); } }),
    screen==="auth" && h(AuthScreen, { t, onSuccess: () => setScreen(me ? "swipe" : "onboarding") }),
    screen==="onboarding" && h(Onboarding, { onDone: async (p) => {
      const authId = await getMyAuthId();
      const withId = { ...p, id: p.id || authId || ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "u-" + Date.now() + "-" + Math.random().toString(36).slice(2)) };
      setMe(withId);
      const exists = DEMO_PROFILES.find(x => x.id === withId.id);
      if (!exists) DEMO_PROFILES.push(withId); else Object.assign(exists, withId);
      saveProfileToCloud(withId);
      setDataVersion(v => v + 1);
      setScreen("swipe");
    } }),
    screen==="swipe" && h(SwipeDeck, { key:"swipe-"+dataVersion, onMatch:sendLike, onUndoMatch:undoMatch, onPassProfile:passProfile, onUndoPass:undoPass, onOpenMap:(filtered)=>{ setMapProfiles(filtered); setScreen("map"); }, matchCount:matches.length, blockedIds, passedIds, matchedIds:matches.map(m=>m.id), sentLikes, liveUpdates, me, initialSearchOpen:reopenSearchOnSwipe, industryFilters, setIndustryFilters, languageFilters, setLanguageFilters, roleFilters, setRoleFilters, locationFilters, setLocationFilters, recentSearches, setRecentSearches }),
    screen==="map" && h(MapScreen, { blockedIds, liveUpdates, me, matchedIds:matches.map(m=>m.id), industryFilters, setIndustryFilters, languageFilters, setLanguageFilters, roleFilters, setRoleFilters, locationFilters, setLocationFilters }),
    screen==="likes" && h(ReceivedLikes, { likes:receivedLikes, onLikeBack:likeBack, onPass:passReceived }),
    screen==="views" && h(ProfileViews, { views:profileViews, unlocked:premiumUnlocked, onUnlock:()=>setPremiumUnlocked(true), onBack:()=>setScreen("swipe"), me, liveUpdates }),
    screen==="chatlist" && h(ChatList, { matches, unreadCounts, onOpen:(m)=>{ if (m.isCloud && myAuthId) loadCloudMessages(m); else ensureSeeded(m.id, m); setActiveChat(m); setScreen("chat"); setUnreadCounts(prev=>{ const c={...prev}; delete c[m.id]; return c; }); } }),
    screen==="chat" && activeChat && h(Chat, { match:activeChat, messages: chatMessages[activeChat.id] || [], onSend:(text)=>sendMessage(activeChat.id, text), onBack:()=>setScreen("chatlist"), onDeleteChat:deleteChat, onBlock:blockUser, onReport:reportUser, liveUpdates, me }),
    screen==="profile" && me && h(ProfileScreen, { me, onEdit:()=>setScreen("editprofile"), onSettings:()=>setScreen("settings") }),
    screen==="editprofile" && h(Onboarding, { initial: me, title:"Edit profile", ctaLabel:"Save changes", onDone:(p)=>{
      setMe(p);
      const exists = DEMO_PROFILES.find(x => x.id === p.id);
      if (exists) Object.assign(exists, p); else DEMO_PROFILES.push(p);
      saveProfileToCloud(p);
      setDataVersion(v => v + 1);
      setScreen("profile");
    }, onCancel:()=>setScreen("profile") }),
    screen==="settings" && h(SettingsScreen, {
      notificationsEnabled, onToggleNotif:()=>setNotificationsEnabled(v=>!v),
      blockedIds, onUnblock:unblockUser,
      passedIds, onResetPassed:resetPassed,
      onLogout:logout, onDeleteAccount:resetDemo,
      onBack:()=>setScreen("profile")
    }),
    showNav && h(BottomNav, { screen, setScreen, onOpenMap:()=>setScreen("map"), likesCount:receivedLikes.length, unreadMsgCount: Object.values(unreadCounts).reduce((a,b)=>a+b,0), t }),
    matchCelebration && h(MatchScreen, {
      me, celebration:matchCelebration,
      onSend:(text) => {
        const p = matchCelebration.profile;
        setChatMessages(prev => ({ ...prev, [p.id]: [{ from:"me", text }] }));
        setTimeout(() => appendMessage(p.id, { from:"them", text:"Hi! Thanks for the message, I like your idea. Tell me more." }), 1200);
        setActiveChat(p);
        setMatchCelebration(null);
        setScreen("chat");
      },
      onSkip:() => setMatchCelebration(null)
    }),
    toast && h(ToastBanner, {
      topOffset:14,
      onClick:()=>{ setActiveChat(toast.match); setScreen("chat"); setUnreadCounts(prev=>{ const c={...prev}; delete c[toast.match.id]; return c; }); setToast(null); },
      onDismiss:()=>setToast(null)
    },
      h(Avatar, { photo:toast.match.photo, initials:toast.match.initials, size:38 }),
      h("div", { style:{ flex:1, minWidth:0 } },
        h("p", { style:{ margin:"0 0 1px", fontSize:12.5, fontWeight:800, color:INK } }, toast.match.name + " messaged you"),
        h("p", { style:{ margin:0, fontSize:12, color:MUTED, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" } }, toast.text)
      )
    ),
    viewToast && h(ToastBanner, {
      topOffset: toast ? 84 : 14,
      onClick:()=>{ setScreen("views"); setUnseenViews(0); setViewToast(null); },
      onDismiss:()=>setViewToast(null)
    },
      h(Avatar, { photo:viewToast.photo, initials:viewToast.initials, size:38 }),
      h("div", { style:{ flex:1, minWidth:0 } },
        h("p", { style:{ margin:"0 0 1px", fontSize:12.5, fontWeight:800, color:INK } }, viewToast.name + " viewed your profile"),
        h("p", { style:{ margin:0, fontSize:12, color:MUTED } }, "Tap to see who's viewing you")
      )
    ),
    likeToast && h(ToastBanner, {
      topOffset: 14 + (toast ? 70 : 0) + (viewToast ? 70 : 0),
      onClick:()=>{ setScreen("likes"); setLikeToast(null); },
      onDismiss:()=>setLikeToast(null)
    },
      h(Avatar, { photo:likeToast.photo, initials:likeToast.initials, size:38 }),
      h("div", { style:{ flex:1, minWidth:0 } },
        h("p", { style:{ margin:"0 0 1px", fontSize:12.5, fontWeight:800, color:INK } }, likeToast.name + " liked you"),
        h("p", { style:{ margin:0, fontSize:12, color:MUTED } }, "Tap to see who chose you")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
